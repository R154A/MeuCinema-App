# Gera o MeuCinemaSetup.exe num computador Windows do GitHub e publica em "Releases".
# Como usar: aba "Actions" > "Gerar instalador" > "Run workflow".
name: Gerar instalador
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Empacotar o app
        run: python -m PyInstaller --noconfirm --clean --windowed --name MeuCinema --icon icon.ico --collect-all webview --add-data "web;web" app.py
      - name: Baixar WebView2
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile installer/MicrosoftEdgeWebview2Setup.exe
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Montar o instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MeuCinema.iss'
      - name: Publicar na aba Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" installer/Output/MeuCinemaSetup.exe --title "Meu Cinema v1.${{ github.run_number }}" --notes "Baixe o MeuCinemaSetup.exe, instale e siga o passo a passo do README para colocar sua chave do TMDB em Ajustes." --latest
